<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects with detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Geist,system-ui,sans-serif;background:#090A0D}
a{color:#6B9BFF}a:hover{color:#9DBBFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #090A0D; color: #E8EBF0; font-family: Geist, system-ui, sans-serif; font-size: 13px;">
<dc-import name="Nav" active="projects" hint-size="1440px,52px"></dc-import>
<div style="flex-grow: 1; display: flex; min-height: 0;">

<main style="flex-shrink: 0; width: 600px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 28px 24px 28px 32px;">
<div style="display: flex; align-items: flex-end; justify-content: space-between;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">Projects</h1>
<div style="color: #8A93A0;">Each project is one set of proxy credentials</div>
</div>
<button style="height: 32px; padding: 0 14px; background: #E8EBF0; border: 0; border-radius: 8px; color: #090A0D; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">New project</button>
</div>
<section style="display: flex; flex-direction: column; background: #0F1115; border: 1px solid #1C2028; border-radius: 10px; overflow: hidden;">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" style="display: grid; grid-template-columns: 1fr 80px 60px; gap: 16px; align-items: center; padding: 14px 16px; background: {{p.bg}}; border: 0; border-bottom: 1px solid #161920; color: #A3ACB9; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer;">
<span style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-weight: 500; color: #E8EBF0;">{{p.name}}</span>
<span style="display: flex; align-items: center; gap: 10px;">
<span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1C2028;"><span style="display: block; width: {{p.w}}; height: 4px; border-radius: 2px; background: {{p.c}};"></span></span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px;">{{p.bw}}</span>
</span>
</span>
<span style="text-align: right; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px;">{{p.rpm}}</span>
<span style="text-align: right; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{p.ec}};">{{p.err}}</span>
</button>
</sc-for>
</section>
<div style="display: grid; grid-template-columns: 1fr 80px 60px; gap: 16px; padding: 0 16px; font-size: 11px; color: #8A93A0;">
<span>Bandwidth used this month</span><span style="text-align: right;">req / min</span><span style="text-align: right;">errors</span>
</div>
</main>

<aside aria-label="Project detail" style="flex-grow: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 28px 32px; background: #0C0E12; border-left: 1px solid #1C2028;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="display: flex; align-items: baseline; gap: 12px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em;">{{sel.name}}</h2>
<span style="color: #8A93A0;">created {{sel.created}}</span>
</div>
<button style="height: 30px; padding: 0 12px; background: transparent; border: 1px solid #2A2F3A; border-radius: 7px; color: #F26B6B; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;">Delete project</button>
</div>

<section style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 12px;">
<h3 style="margin: 0; font-size: 13px; font-weight: 600;">Connect</h3>
<div style="flex-grow: 1;"></div>
<div style="display: flex; gap: 2px; padding: 3px; background: #0F1115; border: 1px solid #1C2028; border-radius: 8px;">
<sc-for list="{{protos}}" as="o" hint-placeholder-count="2">
<button onClick="{{o.pick}}" style="height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;">{{o.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 2px; padding: 3px; background: #0F1115; border: 1px solid #1C2028; border-radius: 8px;">
<sc-for list="{{langs}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" style="height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;">{{o.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: #090A0D; border: 1px solid #1C2028; border-radius: 10px;">
<pre style="flex-grow: 1; margin: 0; min-height: 84px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: #C9D1DC; white-space: pre; overflow: hidden;">{{snippet}}</pre>
<button style="flex-shrink: 0; height: 26px; padding: 0 10px; background: transparent; border: 1px solid #2A2F3A; border-radius: 6px; color: #A3ACB9; font-family: inherit; font-size: 12px; cursor: pointer;">Copy</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; color: #8A93A0;">
<span>API key</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #A3ACB9;">{{sel.key}}</span>
<button style="height: 24px; padding: 0 8px; background: transparent; border: 1px solid #2A2F3A; border-radius: 6px; color: #A3ACB9; font-family: inherit; font-size: 12px; cursor: pointer;">Reveal</button>
<button style="height: 24px; padding: 0 8px; background: transparent; border: 1px solid #2A2F3A; border-radius: 6px; color: #A3ACB9; font-family: inherit; font-size: 12px; cursor: pointer;">Rotate</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid #1C2028;">
<h3 style="margin: 0; font-size: 13px; font-weight: 600;">Limits</h3>
<div style="display: flex; align-items: flex-end; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="limRpm" style="font-size: 12px; color: #8A93A0;">Rate limit, requests per minute</label>
<input id="limRpm" type="text" inputmode="numeric" value="{{rpm}}" onChange="{{setRpm}}" style="width: 220px; height: 32px; box-sizing: border-box; padding: 0 10px; background: #0F1115; border: 1px solid #2A2F3A; border-radius: 8px; color: #E8EBF0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; outline: none;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="limBw" style="font-size: 12px; color: #8A93A0;">Bandwidth quota, GB per month</label>
<input id="limBw" type="text" inputmode="numeric" value="{{quota}}" onChange="{{setQuota}}" style="width: 220px; height: 32px; box-sizing: border-box; padding: 0 10px; background: #0F1115; border: 1px solid #2A2F3A; border-radius: 8px; color: #E8EBF0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; outline: none;">
</div>
<button style="height: 32px; padding: 0 14px; background: {{saveBg}}; border: 1px solid {{saveBd}}; border-radius: 8px; color: {{saveFg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Save</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid #1C2028;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<h3 style="margin: 0; font-size: 13px; font-weight: 600;">Pools, tried in order</h3>
<button style="height: 26px; padding: 0 10px; background: transparent; border: 1px solid #2A2F3A; border-radius: 6px; color: #A3ACB9; font-family: inherit; font-size: 12px; cursor: pointer;">Add pool</button>
</div>
<div style="display: flex; flex-direction: column; background: #0F1115; border: 1px solid #1C2028; border-radius: 10px; overflow: hidden;">
<sc-for list="{{sel.pools}}" as="q" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: 20px 1fr 140px 110px 60px; gap: 16px; align-items: center; height: 40px; padding: 0 16px; border-bottom: 1px solid #161920; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #A3ACB9;">
<span style="color: #8A93A0;">{{q.n}}</span>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #E8EBF0;">{{q.name}}</span>
<span>{{q.strategy}}</span>
<span style="color: {{q.hc}};">{{q.health}}</span>
<button style="justify-self: end; height: 24px; padding: 0 8px; background: transparent; border: 0; color: #8A93A0; font-family: Geist, system-ui, sans-serif; font-size: 12px; cursor: pointer;">Remove</button>
</div>
</sc-for>
</div>
</section>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const selId = st.sel || 'scraper-prod';
const proto = st.proto || 'http';
const lang = st.lang || 'curl';
const data = [
{ name: 'scraper-prod', created: 'Mar 9', key: 'pk_••••••••••••3f9a', rpm: '912', err: '2.1%', ec: '#A3ACB9', w: '91%', c: '#E6B450', bw: '45.5 / 50 GB', limRpm: '1200', limBw: '50',
pools: [{ n: '1', name: 'datacenter-us', strategy: 'round_robin', health: '118 / 212 healthy', hc: '#A3ACB9' }, { n: '2', name: 'public-mix', strategy: 'random', health: '264 / 1,936 healthy', hc: '#A3ACB9' }, { n: '3', name: 'residential-eu', strategy: 'weighted_random', health: '2 / 14 healthy', hc: '#F26B6B' }] },
{ name: 'price-monitor', created: 'Apr 22', key: 'pk_••••••••••••a07c', rpm: '338', err: '6.4%', ec: '#E6B450', w: '38%', c: '#6B9BFF', bw: '7.6 / 20 GB', limRpm: '600', limBw: '20',
pools: [{ n: '1', name: 'public-mix', strategy: 'random', health: '264 / 1,936 healthy', hc: '#A3ACB9' }] },
{ name: 'seo-audit', created: 'Jun 2', key: 'pk_••••••••••••91be', rpm: '34', err: '0.9%', ec: '#A3ACB9', w: '6%', c: '#6B9BFF', bw: '0.6 / 10 GB', limRpm: '120', limBw: '10',
pools: [{ n: '1', name: 'datacenter-us', strategy: 'round_robin', health: '118 / 212 healthy', hc: '#A3ACB9' }] }
];
const sel = data.find((p) => p.name === selId);
const url = (proto === 'http' ? 'http' : 'socks5') + '://' + sel.name + ':$PROXYSM_KEY@proxysm.local:' + (proto === 'http' ? '9080' : '9081');
const snippets = {
curl: ['curl --proxy ' + url + ' \\', '     https://httpbin.org/ip'],
python: ['import os, requests', '', 'proxy = os.path.expandvars("' + url + '")', 'r = requests.get("https://httpbin.org/ip", proxies=dict(http=proxy, https=proxy))'],
node: proto === 'http'
? ['import { ProxyAgent, fetch } from "undici";', '', 'const dispatcher = new ProxyAgent(`' + url.replace('$PROXYSM_KEY', '${process.env.PROXYSM_KEY}') + '`);', 'const res = await fetch("https://httpbin.org/ip", { dispatcher });']
: ['import { SocksProxyAgent } from "socks-proxy-agent";', '', 'const agent = new SocksProxyAgent(`' + url.replace('$PROXYSM_KEY', '${process.env.PROXYSM_KEY}') + '`);', 'const res = await fetch("https://httpbin.org/ip", { agent });']
};
const seg = (defs, cur, key) => defs.map((d) => ({
label: d[1],
bg: d[0] === cur ? '#1C2028' : 'transparent',
fg: d[0] === cur ? '#E8EBF0' : '#8A93A0',
pick: () => this.setState({ [key]: d[0] })
}));
const rpm = st.rpm === undefined ? sel.limRpm : st.rpm;
const quota = st.quota === undefined ? sel.limBw : st.quota;
const dirty = rpm !== sel.limRpm || quota !== sel.limBw;
const digits = (e) => e.target.value.replace(/[^0-9]/g, '');
return {
projects: data.map((p) => Object.assign({}, p, {
bg: p.name === selId ? '#151A24' : 'transparent',
pick: () => this.setState({ sel: p.name, rpm: undefined, quota: undefined })
})),
sel: sel,
protos: seg([['http', 'HTTP'], ['socks5', 'SOCKS5']], proto, 'proto'),
langs: seg([['curl', 'curl'], ['python', 'Python'], ['node', 'Node']], lang, 'lang'),
snippet: snippets[lang].join('\n'),
rpm: rpm,
quota: quota,
setRpm: (e) => this.setState({ rpm: digits(e) }),
setQuota: (e) => this.setState({ quota: digits(e) }),
saveBg: dirty ? '#E8EBF0' : 'transparent',
saveBd: dirty ? '#E8EBF0' : '#2A2F3A',
saveFg: dirty ? '#090A0D' : '#8A93A0'
};
}
}
</script>
</body>
</html>
