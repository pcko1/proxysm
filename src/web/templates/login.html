<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Proxysm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,30 13.5,11 16,4 18.5,11' fill='%236B8CF5'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(91,141,239,0.07), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(125,228,154,0.04), transparent 55%),
                linear-gradient(180deg, #0A0C11, #08090C);
            color: #ECEEF2;
            min-height: 100vh;
            display: grid;
            place-items: center;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 360px;
            padding: 36px 32px 32px;
            background: #0E1014;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
        }
        .mark { width: 44px; height: 44px; margin: 0 auto 14px; filter: drop-shadow(0 0 14px rgba(91,141,239,0.35)); }
        h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
        .sub { font-size: 13px; color: #636B77; margin: 6px 0 24px; }
        input[type="password"] {
            width: 100%;
            background: #060709;
            color: #ECEEF2;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 9px;
            padding: 10px 12px;
            font: 400 14px/1.4 inherit;
            transition: all 0.14s ease;
        }
        input[type="password"]::placeholder { color: #454C56; }
        input[type="password"]:focus {
            outline: none;
            border-color: rgba(91,141,239,0.32);
            box-shadow: 0 0 0 3px rgba(91,141,239,0.12);
        }
        button {
            width: 100%;
            margin-top: 12px;
            height: 38px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(118deg, #6B8CF5 0%, #56C8D8 48%, #7DE49A 100%);
            color: #0A0C11;
            font: 600 13.5px/1 inherit;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 14px rgba(91,141,239,0.28);
            transition: filter 0.14s ease;
        }
        button:hover { filter: brightness(1.06); }
        .error {
            margin-bottom: 14px;
            padding: 9px 12px;
            border-radius: 9px;
            background: rgba(242,107,107,0.10);
            border: 1px solid rgba(242,107,107,0.26);
            color: #F26B6B;
            font-size: 12.5px;
        }
        .foot { margin-top: 20px; font-size: 11.5px; color: #454C56; font-family: "Geist Mono", monospace; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/login">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <defs>
                <linearGradient id="prismGrad" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#6B8CF5"/>
                    <stop offset="0.5" stop-color="#56C8D8"/>
                    <stop offset="1" stop-color="#7DE49A"/>
                </linearGradient>
            </defs>
            <g fill="url(#prismGrad)">
                <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="1"/>
                <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.85" transform="rotate(-20 16 30)"/>
                <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.85" transform="rotate(20 16 30)"/>
                <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.6" transform="rotate(-40 16 30)"/>
                <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.6" transform="rotate(40 16 30)"/>
            </g>
        </svg>
        <h1>Proxysm</h1>
        <p class="sub">Enter the admin password to continue</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="password" name="password" placeholder="Admin password" autofocus autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <div class="foot">Proxysm v0.1.0</div>
    </form>
</body>
</html>
