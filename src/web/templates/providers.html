{% extends "base.html" %}
{% block title %}Providers - ProxyManager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Providers</h1>
    <div class="page-header-actions">
        <button class="btn btn-primary" onclick="openModal('createProviderModal')">Create Provider</button>
    </div>
</div>

<!-- Create Modal -->
<div class="modal-overlay" id="createProviderModal">
    <div class="modal">
        <h2>Create Provider</h2>
        <div class="form-group">
            <label for="providerName">Provider Name</label>
            <input type="text" id="providerName" placeholder="e.g. BrightData" />
        </div>
        <div class="form-group">
            <label for="providerNotes">Notes (optional)</label>
            <textarea id="providerNotes" rows="3" placeholder="Account info, plan details, etc."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal('createProviderModal')">Cancel</button>
            <button class="btn btn-primary" onclick="createProvider()">Create</button>
        </div>
    </div>
</div>

<div class="table-card">
    <table>
        <thead>
            <tr>
                <th class="col-check"><input type="checkbox" class="row-checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
                <th>Name</th>
                <th>Notes</th>
                <th>Proxies</th>
                <th>Created</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="providerTableBody">
        </tbody>
    </table>
</div>
<div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-state-icon">&#127968;</div>
    <h3>No providers yet</h3>
    <p>Create a provider before importing proxies.</p>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadProviders() {
        try {
            const data = await apiCall('GET', '/api/v1/providers');
            const items = data.data || [];
            const tbody = document.getElementById('providerTableBody');
            const empty = document.getElementById('emptyState');

            if (items.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                document.querySelector('.table-card').style.display = 'none';
            } else {
                empty.style.display = 'none';
                document.querySelector('.table-card').style.display = '';
                tbody.innerHTML = items.map(p => {
                    const proxyCount = p.proxy_count !== undefined ? p.proxy_count : 0;
                    const notes = p.notes || '';
                    const notesDisplay = notes.length > 80 ? esc(notes.substring(0, 80)) + '...' : esc(notes);
                    return `<tr>
                        <td class="col-check"><input type="checkbox" class="row-checkbox" data-id="${p.id}" onchange="toggleRowSelection('${p.id}', this)"></td>
                        <td><strong style="color:var(--text-primary)">${esc(p.name)}</strong></td>
                        <td style="color:var(--text-muted);font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${notesDisplay || '-'}</td>
                        <td><span class="stat-pill"><span class="stat-value">${proxyCount}</span></span></td>
                        <td style="color:var(--text-muted);font-size:12px">${fmtDate(p.created_at)}</td>
                        <td class="actions"><button class="btn btn-danger btn-sm" onclick="deleteProvider('${p.id}')">Delete</button></td>
                    </tr>`;
                }).join('');
            }
            clearSelection();
        } catch (e) {
            showToast('Failed to load providers: ' + e.message, 'error');
        }
    }

    async function createProvider() {
        const name = document.getElementById('providerName').value.trim();
        if (!name) { showToast('Provider name is required', 'error'); return; }
        const notes = document.getElementById('providerNotes').value.trim();

        try {
            await apiCall('POST', '/api/v1/providers', { name, notes: notes || null });
            showToast('Provider created', 'success');
            closeModal('createProviderModal');
            document.getElementById('providerName').value = '';
            document.getElementById('providerNotes').value = '';
            loadProviders();
        } catch (e) {
            showToast('Create failed: ' + e.message, 'error');
        }
    }

    async function deleteProvider(id) {
        if (!(await confirmAction('Delete this provider and all its proxies? This cannot be undone.'))) return;
        try {
            await apiCall('DELETE', `/api/v1/providers/${id}`);
            showToast('Provider deleted', 'success');
            loadProviders();
        } catch (e) {
            showToast('Delete failed: ' + e.message, 'error');
        }
    }

    async function bulkDelete() {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;
        if (!(await confirmAction(`Delete ${ids.length} providers and all their proxies? This cannot be undone.`))) return;
        let deleted = 0;
        for (const id of ids) {
            try { await apiCall('DELETE', `/api/v1/providers/${id}`); deleted++; } catch {}
        }
        showToast(`Deleted ${deleted} providers`, 'success');
        clearSelection();
        loadProviders();
    }

    document.getElementById('bulkDeleteBtn').onclick = bulkDelete;
    loadProviders();
</script>
{% endblock %}
