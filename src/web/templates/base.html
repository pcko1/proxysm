<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proxysm{% endblock %}</title>
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,30 13.5,11 16,4 18.5,11' fill='%236B8CF5'/></svg>">
    <link rel="preload" href="/static/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        @font-face {
            font-family: "Geist";
            font-style: normal;
            font-weight: 100 900;
            font-display: optional;
            src: url("/static/fonts/geist.woff2") format("woff2");
        }
        @font-face {
            font-family: "Geist Mono";
            font-style: normal;
            font-weight: 100 900;
            font-display: optional;
            src: url("/static/fonts/geist-mono.woff2") format("woff2");
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* Dark canvas from the first frame — prevents the white flash on load */
        html { background-color: #08090C; color-scheme: dark; }

        :root {
            /* Surfaces (cool near-black, prism design system) */
            --bg-primary: #08090C;
            --bg-secondary: #0E1014;
            --bg-tertiary: #14171C;
            --bg-hover: #181C22;
            --bg-active: #1A1E24;
            --sunken: #060709;
            --surface: var(--bg-secondary);
            --surface-2: var(--bg-tertiary);
            --surface-3: var(--bg-active);
            /* Lines */
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.09);
            --border-2: rgba(255,255,255,0.09);
            --border-strong: rgba(255,255,255,0.14);
            --border-focus: rgba(91,141,239,0.5);
            /* Text */
            --text-primary: #ECEEF2;
            --text-secondary: #98A0AD;
            --text-muted: #636B77;
            --text-4: #454C56;
            /* Prism accent (azure → mint → green) */
            --accent: #5B8DEF;
            --accent-hover: #7FA8FF;
            --accent-subtle: rgba(91,141,239,0.12);
            --accent-line: rgba(91,141,239,0.32);
            --accent-glow: rgba(91,141,239,0.30);
            --prism: linear-gradient(118deg, #6B8CF5 0%, #56C8D8 48%, #7DE49A 100%);
            /* Status */
            --green: #3FCF8E;
            --green-bg: rgba(63,207,142,0.10);
            --green-border: rgba(63,207,142,0.26);
            --red: #F26B6B;
            --red-bg: rgba(242,107,107,0.10);
            --red-border: rgba(242,107,107,0.26);
            --yellow: #E6B450;
            --yellow-bg: rgba(230,180,80,0.10);
            --yellow-border: rgba(230,180,80,0.26);
            --amber: var(--yellow);
            --purple: #A88BFA;
            --purple-bg: rgba(168,139,250,0.10);
            --transition-fast: 0.14s cubic-bezier(0.4,0,0.2,1);
            --transition-base: 0.22s cubic-bezier(0.4,0,0.2,1);
            --transition-slow: 0.34s cubic-bezier(0.4,0,0.2,1);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

        body {
            font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(91,141,239,0.07), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(125,228,154,0.04), transparent 55%),
                linear-gradient(180deg, #0A0C11, var(--bg-primary));
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-feature-settings: "cv01","ss01","tnum";
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        a { color: var(--accent); text-decoration: none; transition: color var(--transition-fast); }
        a:hover { color: var(--accent-hover); }
        a:focus-visible, .stat-pill:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: rgba(9,11,15,0.72);
            border-bottom: 1px solid var(--border);
            padding: 0 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
        }
        .navbar-brand {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 26px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .navbar-brand:hover { color: var(--text-primary); }
        .navbar-brand svg { width: 26px; height: 26px; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(91,141,239,0.35)); }
        .navbar-brand .ver {
            font-size: 10px; font-weight: 500; color: var(--text-muted);
            background: var(--surface-2); border: 1px solid var(--border);
            padding: 1px 6px; border-radius: 5px; letter-spacing: 0.02em;
        }
        .navbar-links { display: flex; gap: 2px; align-items: center; }
        .navbar-links a {
            color: var(--text-muted);
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: -0.01em;
            transition: color var(--transition-fast), background var(--transition-fast);
            position: relative;
        }
        .navbar-links a:hover { color: var(--text-primary); background: var(--bg-hover); }
        .navbar-links a.active {
            color: var(--text-primary);
            background: var(--accent-subtle);
            box-shadow: inset 0 0 0 1px var(--accent-line), 0 0 16px -6px var(--accent-glow);
        }

        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

        .live-pill {
            display: inline-flex; align-items: center; gap: 7px;
            height: 34px; padding: 0 13px;
            background: var(--green-bg); border: 1px solid var(--green-border);
            border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--green);
            letter-spacing: -0.01em;
        }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(63,207,142,0.6); animation: livePulse 2.4s ease-in-out infinite; }
        @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

        .nav-settings-cog {
            color: var(--text-muted);
            width: 34px; height: 34px;
            border-radius: 9px;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }
        .nav-settings-cog:hover { color: var(--text-primary); background: var(--surface-2); border-color: var(--border); }
        .nav-settings-cog.active { color: var(--accent); background: transparent; }

        .nav-setup-btn {
            margin-right: 8px;
            color: #fff;
            background: var(--accent);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }
        .nav-setup-btn:hover {
            background: var(--accent-hover);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 8px;
            margin-left: 4px;
            border-radius: 6px;
            transition: all var(--transition-fast);
        }
        .nav-toggle:hover { color: var(--text-primary); background: var(--bg-hover); }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 26px 60px;
            flex: 1;
        }
        /* entrance animation intentionally omitted — content must always be visible
           (throttled tabs freeze CSS animations at their first frame) */

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .page-header h1 {
            font-size: 25px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            white-space: nowrap;
        }
        .page-header .title-block { display: flex; flex-direction: column; gap: 5px; }
        .page-header .sub { font-size: 13.5px; color: var(--text-muted); letter-spacing: -0.01em; }
        .page-header-actions { display: flex; gap: 9px; align-items: center; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
            white-space: nowrap;
            outline: none;
        }
        .btn:focus-visible {
            box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--accent);
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-primary {
            background: var(--prism);
            color: #0A0C11;
            font-weight: 600;
            border: none;
            box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 14px rgba(91,141,239,0.28);
        }
        .btn-primary:hover {
            filter: brightness(1.06);
            box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 22px rgba(91,141,239,0.40);
        }

        .btn-secondary {
            background: var(--green);
            color: #fff;
            border-color: rgba(255,255,255,0.1);
        }
        .btn-secondary:hover {
            background: #2dd870;
            box-shadow: 0 0 20px rgba(34,197,94,0.15);
        }

        .btn-danger {
            background: transparent;
            color: var(--red);
            border-color: var(--border-light);
        }
        .btn-danger:hover {
            background: var(--red-bg);
            border-color: var(--red-border);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-light);
        }
        .btn-outline:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.15);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 10px;
        }
        .btn-ghost:hover { color: var(--text-primary); background: var(--bg-hover); }

        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

        /* ===== TABLE CARD ===== */
        .table-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== TABLES ===== */
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        thead th {
            text-align: left;
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }
        thead th:first-child { padding-left: 16px; }
        tbody tr { transition: background var(--transition-fast); }
        tbody tr:hover { background: var(--bg-hover); }
        tbody td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            color: var(--text-secondary);
        }
        tbody td:first-child { padding-left: 16px; }
        tbody tr:last-child td { border-bottom: none; }
        td.actions { text-align: right; white-space: nowrap; }
        td.actions .btn + .btn { margin-left: 4px; }

        .cell-truncate {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== CHECKBOXES ===== */
        .row-checkbox {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
            vertical-align: middle;
        }
        th.col-check, td.col-check { width: 44px; text-align: center; }
        tbody tr.selected { background: var(--accent-subtle); }
        tbody tr.selected:hover { background: rgba(59,130,246,0.12); }

        /* ===== BULK BAR ===== */
        .bulk-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            z-index: 150;
            transition: transform var(--transition-slow), opacity var(--transition-slow);
            opacity: 0;
            pointer-events: none;
        }
        .bulk-bar.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .bulk-bar .bulk-count {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 90px;
        }
        .bulk-bar .btn-bulk-delete {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .bulk-bar .btn-bulk-delete:hover { background: #dc2626; }
        .bulk-bar .btn-bulk-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .bulk-bar .btn-bulk-cancel:hover { background: var(--bg-hover); color: var(--text-secondary); }

        /* ===== STATUS BADGES ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .badge-healthy { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
        .badge-healthy::before { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
        .badge-degraded { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
        .badge-degraded::before { background: var(--yellow); box-shadow: 0 0 6px rgba(234,179,8,0.4); }
        .badge-dead { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
        .badge-dead::before { background: var(--red); }
        .badge-unknown { background: rgba(99,99,110,0.08); color: var(--text-muted); border: 1px solid rgba(99,99,110,0.15); }
        .badge-unknown::before { background: var(--text-muted); }

        /* ===== PROTOCOL TAGS ===== */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag-http { background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid rgba(59,130,246,0.15); }
        .tag-https { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
        .tag-socks5 { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.2); }

        /* ===== MONO TEXT ===== */
        .mono {
            font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===== FORMS ===== */
        input[type="text"], textarea, select {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 13px;
            font-family: inherit;
            width: 100%;
            transition: all var(--transition-fast);
        }
        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }
        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-subtle), 0 0 12px var(--accent-glow);
        }
        textarea { resize: vertical; min-height: 80px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group { margin-bottom: 16px; }
        select { cursor: pointer; }

        /* ===== FILE INPUT ===== */
        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            z-index: 1;
        }
        .file-input-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }
        .file-input-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .file-input-name {
            font-size: 12px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 18px;
            letter-spacing: -0.3px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* ===== CONFIRM MODAL ===== */
        .confirm-modal .modal {
            max-width: 380px;
            text-align: center;
        }
        .confirm-modal .confirm-icon {
            font-size: 36px;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        .confirm-modal h2 { font-size: 16px; margin-bottom: 8px; }
        .confirm-modal .confirm-message {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 4px;
        }
        .confirm-modal .modal-actions { justify-content: center; }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .pagination-info { color: var(--text-muted); font-size: 12px; }

        /* ===== TOASTS ===== */
        .toast-container {
            position: fixed;
            top: 68px;
            right: 16px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            min-width: 260px;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
            animation: toastIn 0.25s cubic-bezier(0.16,1,0.3,1);
        }
        .toast-icon {
            font-size: 16px;
            flex-shrink: 0;
            line-height: 1;
        }
        .toast-success {
            background: var(--bg-tertiary);
            color: var(--green);
            border: 1px solid var(--green-border);
        }
        .toast-error {
            background: var(--bg-tertiary);
            color: var(--red);
            border: 1px solid var(--red-border);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px) scale(0.96); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* ===== ALERTS ===== */
        .alert-warning {
            background: var(--yellow-bg);
            border: 1px solid var(--yellow-border);
            color: var(--yellow);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .alert-warning-content { flex: 1; line-height: 1.6; }
        .alert-warning strong { color: var(--text-primary); }
        .alert-warning code {
            background: rgba(0,0,0,0.3);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            word-break: break-all;
            color: var(--text-primary);
            font-family: "Geist Mono", monospace;
        }
        .alert-dismiss {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }
        .alert-dismiss:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }

        /* ===== COPY BUTTON ===== */
        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .copy-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }

        /* ===== CODE BLOCK ===== */
        .code-block {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace;
            font-size: 12px;
            overflow-x: auto;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        /* Override highlight.js background to match our theme */
        .code-block.hljs,
        .code-block code.hljs {
            background: var(--bg-primary);
            padding: 0;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            margin-bottom: 14px;
            color: var(--text-muted);
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .empty-state p { font-size: 13px; }

        /* ===== BUTTON LOADING ===== */
        .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: btnSpin 0.6s linear infinite;
        }
        @keyframes btnSpin { to { transform: rotate(360deg); } }

        /* ===== DESIGN-SYSTEM COMPONENTS (panels, KPIs, segs, tables) ===== */
        .row { display: flex; align-items: center; gap: 10px; }
        .spacer { flex: 1; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }
        .panel-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 15px 18px; border-bottom: 1px solid var(--border);
        }
        .panel-head h2, .panel-head h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); white-space: nowrap; }
        .panel-head .hint { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-body { padding: 18px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .kpi {
            position: relative; overflow: hidden;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 17px 18px 16px;
            transition: border-color var(--transition-base);
        }
        .kpi:hover { border-color: var(--border-2); }
        .kpi .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .kpi .kpi-label { font-size: 12px; font-weight: 500; color: var(--text-muted); letter-spacing: -0.01em; white-space: nowrap; }
        .kpi .kpi-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary); }
        .kpi .kpi-val { font: 600 30px/1 "Geist Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--text-primary); }
        .kpi .kpi-foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
        .delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 12px; }
        .delta.up { color: var(--green); }
        .delta.down { color: var(--red); }
        .delta.flat { color: var(--text-muted); }
        .kpi.tone-green .kpi-val { color: var(--green); }
        .kpi.tone-amber .kpi-val { color: var(--amber); }
        .kpi.tone-red .kpi-val   { color: var(--red); }
        .kpi.tone-green .kpi-ic { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
        .kpi.tone-amber .kpi-ic { color: var(--amber); background: var(--yellow-bg); border-color: var(--yellow-border); }
        .kpi.tone-red .kpi-ic   { color: var(--red);   background: var(--red-bg);   border-color: var(--red-border); }

        .seg {
            display: inline-flex; gap: 2px; padding: 3px;
            background: var(--sunken); border: 1px solid var(--border); border-radius: 10px;
        }
        .seg button {
            height: 28px; padding: 0 13px; border: none; border-radius: 7px;
            background: transparent; color: var(--text-muted); font: 500 12.5px/1 inherit;
            font-family: inherit; cursor: pointer; transition: all var(--transition-fast); letter-spacing: -0.01em;
        }
        .seg button:hover { color: var(--text-secondary); }
        .seg button.active { background: var(--surface-2); color: var(--text-primary); box-shadow: var(--shadow-sm); }
        .seg-mini { padding: 2px; }
        .seg-mini button { height: 24px; padding: 0 9px; font-size: 11.5px; }

        .table-scroll { overflow-x: auto; }
        table.tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
        table.tbl thead th {
            text-align: center; padding: 11px 16px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--text-muted); background: var(--sunken);
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        table.tbl tbody td {
            padding: 13px 16px; font-size: 13px; color: var(--text-secondary); text-align: center;
            border-bottom: 1px solid var(--border); vertical-align: middle;
        }
        table.tbl tbody tr { transition: background var(--transition-fast); }
        table.tbl tbody tr:hover { background: var(--bg-hover); }
        table.tbl tbody tr:last-child td { border-bottom: none; }
        table.tbl td .strong { color: var(--text-primary); font-weight: 500; }

        .tag-neutral {
            background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border-2);
            text-transform: none; letter-spacing: 0;
            font-family: "Geist Mono", monospace; font-size: 10.5px;
        }

        /* ===== PAGE TRANSITIONS ===== */
        /* Same-origin navigations crossfade; the navbar and footer are their own
           snapshot groups so they stay visually fixed instead of flickering. */
        @view-transition { navigation: auto; }
        .navbar { view-transition-name: navbar; }
        .footer { view-transition-name: footer; }
        @media (prefers-reduced-motion: reduce) {
            ::view-transition-group(*),
            ::view-transition-old(*),
            ::view-transition-new(*) { animation: none !important; }
        }

        /* ===== API FAILURE BANNER ===== */
        .api-banner {
            position: sticky; top: 60px; z-index: 99;
            display: none; align-items: center; gap: 10px;
            padding: 9px 22px;
            background: rgba(242,107,107,0.10);
            border-bottom: 1px solid var(--red-border);
            color: var(--red); font-size: 13px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .api-banner.visible { display: flex; }

        /* ===== FOOTER ===== */
        .footer {
            border-top: 1px solid var(--border);
            padding: 20px 26px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-muted);
        }
        .footer a { color: var(--text-muted); }
        .footer a:hover { color: var(--text-secondary); }
        .dot-sep { color: var(--text-4); margin: 0 7px; }

        /* ===== SKELETON LOADING ===== */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-hover) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== STAT PILLS ===== */
        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-weight: 500;
            color: var(--text-muted);
        }
        .stat-pill .stat-value { color: var(--text-primary); font-weight: 600; }
        .stat-pill:hover { border-color: var(--border-light); background: var(--bg-hover); }

        /* ===== RESPONSIVE: TABLET ===== */
        @media (max-width: 1080px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 900px) {
            .navbar { padding: 0 16px; }
            .navbar-brand { margin-right: 20px; }
            .navbar-links a { padding: 7px 10px; font-size: 12px; }
            .live-pill { display: none; }
            .container { padding: 20px 16px; }
            .page-header h1 { font-size: 21px; }
            .grid-2 { grid-template-columns: 1fr; }
            td.actions .btn-sm { padding: 4px 8px; font-size: 11px; }
        }

        /* ===== RESPONSIVE: MOBILE ===== */
        @media (max-width: 640px) {
            .nav-toggle { display: block; }
            .navbar-links {
                display: none;
                position: absolute;
                top: 56px;
                left: 0;
                right: 0;
                background: rgba(13,13,18,0.95);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                padding: 8px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            }
            .navbar-links.open { display: flex; }
            .navbar-links a { padding: 12px 16px; border-radius: 8px; }
            .navbar { flex-wrap: wrap; position: relative; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
            .container { padding: 16px 12px; }
            .page-header { flex-direction: column; align-items: flex-start; }
            .page-header-actions { width: 100%; }
            .page-header-actions .btn { flex: 1; }
            .bulk-bar { left: 12px; right: 12px; transform: translateX(0) translateY(80px); }
            .bulk-bar.visible { transform: translateX(0) translateY(0); }
            .modal { margin: 0 8px; padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="prismGrad" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#6B8CF5"/>
                        <stop offset="0.5" stop-color="#56C8D8"/>
                        <stop offset="1" stop-color="#7DE49A"/>
                    </linearGradient>
                </defs>
                <g fill="url(#prismGrad)">
                    <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="1"/>
                    <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.85" transform="rotate(-20 16 30)"/>
                    <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.85" transform="rotate(20 16 30)"/>
                    <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.6" transform="rotate(-40 16 30)"/>
                    <polygon points="16,30 13.5,12 16,4 18.5,12" opacity="0.6" transform="rotate(40 16 30)"/>
                </g>
            </svg>
            Proxysm <span class="ver">v0.1</span>
        </a>
        <div class="navbar-links" id="navLinks">

            <a href="/proxies" id="nav-proxies">Proxies</a>
            <a href="/pools" id="nav-pools">Pools</a>
            <a href="/projects" id="nav-projects">Projects</a>
            <a href="/api-docs" id="nav-api-docs">API Docs</a>
        </div>
        <div class="nav-right">
        <span class="live-pill"><span class="live-dot"></span>Live</span>
        <a href="/settings" class="nav-settings-cog" id="nav-settings" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        <a href="/logout" class="nav-settings-cog" id="nav-logout" title="Sign out">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
    </nav>
    <script>
        // Runs before first paint so the active pill never pops in late
        (function() {
            const path = window.location.pathname;
            document.querySelectorAll('.navbar-links a').forEach(link => {
                if (path.startsWith(link.getAttribute('href'))) {
                    link.classList.add('active');
                }
            });
            const cog = document.getElementById('nav-settings');
            if (cog && path.startsWith('/settings')) {
                cog.classList.add('active');
            }
            // Clicking the tab you are already on is a no-op, not a reload
            document.querySelectorAll('.navbar-links a, #nav-settings').forEach(link => {
                link.addEventListener('click', e => {
                    if (location.pathname === link.getAttribute('href')) e.preventDefault();
                });
            });
        })();
    </script>

    <div class="api-banner" id="apiBanner" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span id="apiBannerMsg"></span>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <span class="mono">Proxysm v0.1.0</span>
        <span class="dot-sep">·</span>
        <span>HTTP <span class="mono" style="color:var(--text-secondary)">:{{ http_port }}</span></span>
        <span>SOCKS5 <span class="mono" style="color:var(--text-secondary)">:{{ socks5_port }}</span></span>
        <span class="spacer"></span>
        <a href="/api-docs">API reference</a>
        <a href="/settings">Settings</a>
    </footer>

    <!-- Bulk action bar -->
    <div class="bulk-bar" id="bulkBar" aria-hidden="true">
        <span class="bulk-count" id="bulkCount">0 selected</span>
        <button class="btn-bulk-cancel" onclick="clearSelection()">Cancel</button>
        <button class="btn-bulk-delete" id="bulkDeleteBtn">Delete Selected</button>
    </div>

    <!-- Confirm dialog -->
    <div class="modal-overlay confirm-modal" id="confirmModal">
        <div class="modal">
            <div class="confirm-icon" id="confirmIcon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
            <h2 id="confirmTitle">Are you sure?</h2>
            <p class="confirm-message" id="confirmMessage"></p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="confirmCancelBtn">Cancel</button>
                <button class="btn" id="confirmOkBtn" style="background:var(--red);color:#fff;border-color:var(--red-border)">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Mobile nav toggle
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('navLinks').classList.toggle('open');
        });
        // Close mobile nav on link click
        document.querySelectorAll('.navbar-links a').forEach(function(link) {
            link.addEventListener('click', function() {
                document.getElementById('navLinks').classList.remove('open');
            });
        });

        // API failure banner
        function showApiBanner(msg) {
            const banner = document.getElementById('apiBanner');
            if (!banner) return;
            document.getElementById('apiBannerMsg').textContent = msg;
            banner.classList.add('visible');
        }
        function hideApiBanner() {
            const banner = document.getElementById('apiBanner');
            if (banner) banner.classList.remove('visible');
        }

        // API helper — authenticated by the session cookie
        async function apiCall(method, url, body) {
            const opts = {
                method: method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body !== undefined && body !== null) {
                opts.body = JSON.stringify(body);
            }
            let resp;
            try {
                resp = await fetch(url, opts);
            } catch (e) {
                showApiBanner('Cannot reach the Proxysm API — check that the server is running.');
                throw e;
            }
            if (resp.status === 401) {
                window.location.href = '/login';
                throw new Error('Session expired — redirecting to login');
            }
            if (resp.status >= 500) {
                showApiBanner(`The API returned an error (${resp.status}) — see server logs.`);
            } else {
                hideApiBanner();
            }
            if (!resp.ok) {
                let msg = `Error ${resp.status}`;
                try {
                    const data = await resp.json();
                    msg = data.detail || JSON.stringify(data);
                } catch {}
                throw new Error(msg);
            }
            if (resp.status === 204) return null;
            return resp.json();
        }

        // Toast notifications with icons
        function showToast(message, type) {
            type = type || 'success';
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            const icon = type === 'success' ? '\u2713' : '\u2717';
            el.innerHTML = '<span class="toast-icon">' + icon + '</span><span>' + esc(message) + '</span>';
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(20px)';
                el.style.transition = 'all 0.2s ease';
                setTimeout(() => el.remove(), 200);
            }, 3500);
        }

        // Modal helpers
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            // Auto-focus first text input
            setTimeout(function() {
                const input = modal.querySelector('input[type="text"]:not([type="hidden"]), textarea, select');
                if (input) input.focus();
            }, 80);
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // Button loading state helpers
        function btnLoading(btn) {
            btn.disabled = true;
            btn.classList.add('btn-loading');
        }
        function btnReset(btn) {
            btn.disabled = false;
            btn.classList.remove('btn-loading');
        }

        // Close modals on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const confirmModal = document.getElementById('confirmModal');
                if (confirmModal.classList.contains('active')) {
                    document.getElementById('confirmCancelBtn').click();
                    return;
                }
                const activeModal = document.querySelector('.modal-overlay.active');
                if (activeModal && activeModal.id !== 'confirmModal') {
                    activeModal.classList.remove('active');
                }
            }
        });

        // Close modals on backdrop click
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay') && e.target.classList.contains('active')) {
                if (e.target.id === 'confirmModal') {
                    document.getElementById('confirmCancelBtn').click();
                } else {
                    e.target.classList.remove('active');
                }
            }
        });

        // Styled confirm dialog
        function confirmAction(message, title) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                document.getElementById('confirmMessage').textContent = message;
                document.getElementById('confirmTitle').textContent = title || 'Are you sure?';
                modal.classList.add('active');

                function cleanup() {
                    modal.classList.remove('active');
                    document.getElementById('confirmOkBtn').removeEventListener('click', onOk);
                    document.getElementById('confirmCancelBtn').removeEventListener('click', onCancel);
                }
                function onOk() { cleanup(); resolve(true); }
                function onCancel() { cleanup(); resolve(false); }

                document.getElementById('confirmOkBtn').addEventListener('click', onOk);
                document.getElementById('confirmCancelBtn').addEventListener('click', onCancel);
            });
        }

        // Format date
        function fmtDate(s) {
            if (!s) return '-';
            const d = new Date(s);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Escape HTML
        function esc(s) {
            if (s === null || s === undefined) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        // Selection state
        let selectedIds = new Set();

        function updateBulkBar() {
            const bar = document.getElementById('bulkBar');
            const count = selectedIds.size;
            document.getElementById('bulkCount').textContent = count + ' selected';
            const visible = count > 0;
            bar.classList.toggle('visible', visible);
            bar.setAttribute('aria-hidden', !visible);
        }

        function toggleRowSelection(id, checkbox) {
            const row = checkbox.closest('tr');
            if (checkbox.checked) {
                selectedIds.add(id);
                row.classList.add('selected');
            } else {
                selectedIds.delete(id);
                row.classList.remove('selected');
            }
            updateSelectAll();
            updateBulkBar();
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('tbody .row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
                const row = cb.closest('tr');
                const id = cb.dataset.id;
                if (masterCheckbox.checked) {
                    selectedIds.add(id);
                    row.classList.add('selected');
                } else {
                    selectedIds.delete(id);
                    row.classList.remove('selected');
                }
            });
            updateBulkBar();
        }

        function updateSelectAll() {
            const master = document.getElementById('selectAll');
            if (!master) return;
            const checkboxes = document.querySelectorAll('tbody .row-checkbox');
            const allChecked = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
            const someChecked = Array.from(checkboxes).some(cb => cb.checked);
            master.checked = allChecked;
            master.indeterminate = someChecked && !allChecked;
        }

        function clearSelection() {
            selectedIds.clear();
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = false;
                const row = cb.closest('tr');
                if (row) row.classList.remove('selected');
            });
            const master = document.getElementById('selectAll');
            if (master) { master.checked = false; master.indeterminate = false; }
            updateBulkBar();
        }

        // Protocol tag helper
        function protoTag(protocol) {
            const p = esc(protocol);
            return `<span class="tag tag-${p}">${p}</span>`;
        }

        // Status badge helper
        function statusBadge(status) {
            const s = status || 'unknown';
            return `<span class="badge badge-${esc(s)}">${esc(s)}</span>`;
        }

        // File input display helper
        function updateFileInput(input, nameSpan) {
            if (input.files.length > 0) {
                nameSpan.textContent = input.files[0].name;
            } else {
                nameSpan.textContent = 'No file selected';
            }
        }

        // Auto-add copy buttons and syntax highlighting to code blocks
        function addCopyButtons() {
            document.querySelectorAll('.code-block').forEach(function(block) {
                if (block.dataset.copyReady) return;
                block.dataset.copyReady = '1';
                block.style.position = 'relative';
                // Apply syntax highlighting if block has a language class
                var code = block.querySelector('code[class*="language-"]') || block;
                if (code.className && /language-/.test(code.className) && typeof hljs !== 'undefined') {
                    hljs.highlightElement(code);
                }
                var btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.style.cssText = 'position:absolute;top:6px;right:6px;';
                btn.onclick = function(e) {
                    e.stopPropagation();
                    var text = block.textContent.replace(/Copy(ed!)?$/, '').trim();
                    navigator.clipboard.writeText(text).then(function() {
                        btn.textContent = 'Copied!';
                        btn.style.color = 'var(--green)';
                        setTimeout(function() { btn.textContent = 'Copy'; btn.style.color = ''; }, 2000);
                    });
                };
                block.appendChild(btn);
            });
        }
        addCopyButtons();
        new MutationObserver(addCopyButtons).observe(document.body, { childList: true, subtree: true });

        // Enter key submits primary button in modals
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            if (e.target.tagName === 'TEXTAREA') return;
            var modal = e.target.closest('.modal-overlay.active');
            if (!modal || modal.id === 'confirmModal') return;
            var primaryBtn = modal.querySelector('.modal-actions .btn-primary');
            if (primaryBtn && !primaryBtn.disabled) {
                e.preventDefault();
                primaryBtn.click();
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
