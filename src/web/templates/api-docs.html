{% extends "base.html" %}
{% block title %}API Docs{% endblock %}
{% block content %}
<style>
    /* Remove container padding for full-width ReDoc */
    .container { max-width: 100%; padding: 0; }

    .redoc-wrap {
        background: var(--bg-primary) !important;
        min-height: calc(100vh - 120px);
    }

    /* ReDoc dark theme overrides to match Proxysm UI */
    .redoc-wrap .menu-content {
        background: var(--bg-secondary) !important;
    }

    /* Hide ReDoc's own top bar since we have our navbar */
    .redoc-wrap > div > div:first-child > div:first-child {
        display: none !important;
    }
</style>

<div id="redoc-container"></div>

<script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
<script>
    Redoc.init('/openapi.json', {
        theme: {
            colors: {
                primary: { main: '#6366F1' },
                success: { main: '#10B981' },
                warning: { main: '#F59E0B' },
                error: { main: '#EF4444' },
                text: {
                    primary: '#EDEDF0',
                    secondary: '#9898A6',
                },
                http: {
                    get: '#10B981',
                    post: '#6366F1',
                    put: '#F59E0B',
                    delete: '#EF4444',
                    patch: '#A78BFA',
                },
            },
            typography: {
                fontSize: '14px',
                fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                headings: {
                    fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                    fontWeight: '600',
                },
                code: {
                    fontFamily: '"JetBrains Mono", "Fira Code", monospace',
                    fontSize: '13px',
                    backgroundColor: 'rgba(255,255,255,0.05)',
                },
                links: {
                    color: '#818CF8',
                },
            },
            sidebar: {
                backgroundColor: '#0D0D12',
                textColor: '#9898A6',
                activeTextColor: '#EDEDF0',
                groupHeadings: {
                    textTransform: 'uppercase',
                },
                level1Items: {
                    textTransform: 'none',
                },
            },
            rightPanel: {
                backgroundColor: '#0D0D12',
                textColor: '#EDEDF0',
            },
            schema: {
                nestedBackground: '#141419',
                typeNameColor: '#A78BFA',
                typeTitleColor: '#EDEDF0',
            },
            codeBlock: {
                backgroundColor: '#0D0D12',
            },
        },
        scrollYOffset: 56,
        hideDownloadButton: true,
        noAutoAuth: true,
        pathInMiddlePanel: true,
        requiredPropsFirst: true,
        sortPropsAlphabetically: false,
        hideSchemaPattern: false,
        nativeScrollbars: true,
    }, document.getElementById('redoc-container'));
</script>
{% endblock %}
